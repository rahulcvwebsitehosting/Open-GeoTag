<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map { height: 100%; margin: 0; background: #f3edf7; }
        .leaflet-control-attribution { font-size: 11px; }
        .hint {
            position: absolute; z-index: 1000; left: 16px; right: 16px; top: 16px;
            padding: 12px 14px; border-radius: 10px; background: rgba(255,255,255,.95);
            color: #1d1b20; font: 600 14px sans-serif; box-shadow: 0 2px 10px rgba(0,0,0,.18);
        }
    </style>
</head>
<body>
<div id="map" role="application" aria-label="Tap the map to choose a location"></div>
<div class="hint" id="hint">Tap anywhere to move the location pin</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const query = new URLSearchParams(location.search);
    let latitude = Number(query.get('lat')) || 20.5937;
    let longitude = Number(query.get('lng')) || 78.9629;
    window.GeoTagPicker = {
        submit: () => location.href =
            'geotagcv://select?lat=' + encodeURIComponent(latitude) +
            '&lng=' + encodeURIComponent(longitude)
    };
    if (typeof L === 'undefined') {
        document.getElementById('hint').textContent =
            'Map unavailable offline. Use the coordinate fields instead.';
    } else {
        const map = L.map('map').setView([latitude, longitude], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        const marker = L.marker([latitude, longitude]).addTo(map);
        map.on('click', event => {
            latitude = event.latlng.lat;
            longitude = event.latlng.lng;
            marker.setLatLng(event.latlng);
            document.getElementById('hint').textContent =
                latitude.toFixed(6) + ', ' + longitude.toFixed(6);
        });
    }
</script>
</body>
</html>
